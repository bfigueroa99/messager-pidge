name: verify

on:
  push:
    branches: ['claude/**', 'main']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm run typecheck

      - name: lint
        run: pnpm run lint

      # PGlite runs a real Postgres in WASM, so the RLS suite needs no service
      # containers and no Docker daemon.
      - name: test
        run: pnpm run test:cov

      - name: gate — no checkbox without a test
        run: pnpm run gate:roadmap

      - name: gate — test-count ratchet
        run: pnpm run gate:tests
